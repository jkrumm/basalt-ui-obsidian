# How the factory ships this project (software-factory docs/project.md).
apiVersion: factory/v2
name: basalt-ui-obsidian
deploy:
  mode: make # `make deploy` builds the checkout on the mini; Caddy serves dist/ live and `make verify` proves it serves the build
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 5m
ship:
  - { via: push }
# One lead: `make deploy` rebuilds the single apps/demo/dist that Caddy serves on :7733, so two deploys would overwrite each other and `make verify` could not tell which build is live.
leads: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
