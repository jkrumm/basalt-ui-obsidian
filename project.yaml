# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: basalt-ui-obsidian
deploy:
  mode: make # `make deploy` builds the checkout on the mini and recreates the nginx container; `make verify` proves it serves the build
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 5m
ship:
  - { paths: ["**"], via: push }
leads: 1
