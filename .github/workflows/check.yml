# basalt-ui consumer CI seed — placed at .github/workflows/check.yml by `basalt-ui init`,
# then owned by the consumer (sync never touches it again). Mirrors the basalt-ui gate
# order: frozen install -> lint + theme guard -> doctrine drift gate -> format check.
# `basalt-ui check-theme` is the palette guard shipped by basalt-ui (fails on raw
# color literals / off-identity accents that bypass the --vx-* token system).
# `basalt-ui sync --check` fails when the basalt-managed files (rules, skills, the
# CLAUDE block) have drifted from the installed basalt-ui version.
#
# The basalt-ui steps below invoke the LOCAL bin, not `bunx basalt-ui`. basalt is a peer +
# devDependency of `packages/basalt-ui-obsidian` and NOT a root dependency, so under bun's
# isolated linker it installs beside that package and nothing lands in the root
# `node_modules/.bin` — `bunx` then silently downloads a different copy from npm (verified
# against basalt-ui 1.20.0: it recreates a `bunx-*-basalt-ui@latest` temp install every run).
# The same resolved path is why `.oxlintrc.json` and `lefthook.yml` extend through
# `packages/basalt-ui-obsidian/node_modules/basalt-ui/...`. `basalt-ui doctor` prints the path
# to use.
name: check
on:
  pull_request:
  push:
    branches: [master]

env:
  BASALT: ./packages/basalt-ui-obsidian/node_modules/.bin/basalt-ui

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx oxlint .
      - run: $BASALT doctor
      - run: $BASALT check-theme
      - run: $BASALT sync --check
      # Rendered from `basalt.roots` — this repo is a monorepo, so the seed's `src/**` matches nothing.
      - run: bunx oxfmt 'packages/**' 'apps/**' '!**/dist/**' --check
      # Build BEFORE typecheck, twice over. The demo resolves `basalt-ui-obsidian`
      # and `obsidian-vault-core` through their emitted `.d.ts`, and its
      # `src/routeTree.gen.ts` is gitignored — the router plugin writes it during a
      # build. A fresh checkout has neither, so typecheck reported 30+ TS2307/TS7006
      # errors that said nothing about the code. Locally both artifacts already
      # exist, which is why this only ever failed in CI.
      - run: bun run build
      # A throwaway one-note vault. `vaultData()` has no default VAULT_DIR on
      # purpose — a hardcoded path leaks a username and, on a fresh clone, would
      # silently read whatever happens to sit there. Building the demo is also a
      # stronger gate than typechecking it.
      - run: |
          mkdir -p /tmp/ci-vault
          printf '# CI\n\nA note.\n' > /tmp/ci-vault/note.md
      - run: VAULT_DIR=/tmp/ci-vault bun --filter @basalt-ui-obsidian/demo build
      - run: bun run typecheck
      - run: bun run test
