# Seeded by basalt-ui init — you own this file; sync never touches it again.
# The extends target supplies oxlint + oxfmt + check-theme pre-commit jobs and
# auto-updates with the basalt-ui package. Add your own commands alongside.
#
# The path reaches basalt where it ACTUALLY installs. basalt is a dependency of
# `packages/basalt-ui-obsidian`, not of the root, so under bun's isolated linker there is no
# `node_modules/basalt-ui` at the root — and lefthook merges a missing `extends` target
# silently, leaving zero hooks with a green `lefthook dump`. `basalt-ui doctor` prints the
# path to use.
extends:
  - packages/basalt-ui-obsidian/node_modules/basalt-ui/configs/lefthook.yml

# The preset's `check-theme` job runs
# `${BASALT_BIN:-${BASALT_CWD:+$BASALT_CWD/}node_modules/.bin/basalt-ui}` (1.30.0 replaced the old
# `bunx --no-install basalt-ui` fallback). An `extends` target still WINS over the local file on a
# colliding key, so `run:` cannot be overridden — but `env:` is a key the preset does not define, so
# it merges. `BASALT_BIN` is still needed here, and `BASALT_CWD` is still not: the basalt config
# lives in the ROOT package.json (`basalt.roots` spans both workspaces), so the root IS the right
# cwd — but bun's isolated linker puts basalt beside `packages/basalt-ui-obsidian`, so the new
# default's `node_modules/.bin/basalt-ui` does not exist at this root either.
pre-commit:
  commands:
    check-theme:
      env:
        BASALT_BIN: ./packages/basalt-ui-obsidian/node_modules/.bin/basalt-ui
