# Serves the built demo app (apps/demo/dist, BIND-MOUNTED — not baked into
# the image, see docker-compose.yml). Listens on 7733; Caddy's reverse_proxy
# fronts this over the tailnet door, never `root`/`file_server` (a Caddyfile
# `file_server` block is invisible to scripts/caddy-tailnet.sh, which only
# understands a `reverse_proxy` block's one name + one port).
#
# Cache policy copied from
# prometheus-scripts/analysis/dashboard/frontend/nginx.conf verbatim in
# shape: hashed asset filenames (Vite's default) are content-addressed, so
# caching them forever is safe — a changed file gets a new name. Everything
# else that can change without a filename change must be no-cache.
server {
    listen 7733;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must NEVER be cached — a stale cached copy would keep
    # serving an old app shell after a rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # vault.json / search-index.json are the vault's CONTENT, not a hashed
    # asset — they're rewritten in place by every `make refresh` (the
    # LaunchAgent's 5-minute content-refresh tick), while index.html and the
    # JS bundle stay untouched. Caching them like a hashed asset would mean a
    # vault refresh never reaches a browser that already fetched the old
    # copy — same reasoning as index.html above, just for content instead of
    # code.
    location = /vault.json {
        add_header Cache-Control "no-cache";
    }
    location = /search-index.json {
        add_header Cache-Control "no-cache";
    }

    # sw.js must be no-cache for the same reason, one level up: a cached
    # service worker never learns a new one was published, so the installed
    # PWA would keep running whatever precache manifest it first saw.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — any path that isn't a real file resolves to index.html
    # so TanStack Router's client-side routes work on a hard refresh/deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
